services:
  - type: web
    name: family-os-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run db:migrate && npm run db:check && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FAMILY_OS_DATA_SOURCE
        value: database
      - key: FAMILY_OS_BILLING_PROVIDER
        value: mock
      - key: WEB_PUSH_VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
