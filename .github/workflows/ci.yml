name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://family_os:family_os@localhost:5432/family_os
      DIRECT_URL: postgresql://family_os:family_os@localhost:5432/family_os
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family_os
          POSTGRES_PASSWORD: family_os
          POSTGRES_DB: family_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run env:check
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:check
      - run: npm run db:smoke:money
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
